apply plugin: 'kotlin-android'

apply from: "$rootDir/gradle/scripts/version-utils.gradle"
apply from: "$rootDir/gradle/scripts/dependencies.gradle"

android {
    def gitVersionCode = getGitVersionCode()
    def gitVersionName = getGitVersionName()

    compileSdk 34
    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode gitVersionCode
        versionName gitVersionName

    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}